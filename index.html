<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a120b">

     صفحة المنيو الرقمية — BAR CAFE
     عربي / English

     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17110a;
    --bg2:#201710;
    --card:#2a1f14;
    --card2:#33251a;
    --cream:#f3e6d0;
    --cream-dim:#cbb79a;
    --gold:#d9a441;
    --gold2:#f0c569;
    --line:rgba(217,164,65,.22);
    --radius:16px;
    --shadow:0 6px 22px rgba(0,0,0,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(217,164,65,.14), transparent 60%),
      radial-gradient(900px 400px at 10% 110%, rgba(120,60,20,.25), transparent 60%),
      var(--bg);
    color:var(--cream);
    font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
    line-height:1.6;
    min-height:100vh;
  }
  html[dir="ltr"] body{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif}

  /* ---------- Header ---------- */
  .hero{
    position:relative;
    text-align:center;
    padding:56px 16px 34px;
    background:
      linear-gradient(180deg, rgba(23,17,10,.2), var(--bg) 92%),
      radial-gradient(700px 260px at 50% 0%, rgba(217,164,65,.18), transparent 70%);
    border-bottom:1px solid var(--line);
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute;inset:0;
    background-image:radial-gradient(rgba(240,197,105,.16) 1px, transparent 1px);
    background-size:26px 26px;
    opacity:.5;pointer-events:none;
  }
  .badge{
    display:inline-block;
    font-size:12px;letter-spacing:4px;font-weight:700;
    color:var(--gold2);
    border:1px solid var(--line);
    padding:6px 18px;border-radius:999px;
    background:rgba(217,164,65,.08);
    margin-bottom:16px;
    text-transform:uppercase;
  }
  .hero h1{
    font-family:'Playfair Display','Cairo',serif;
    font-size:clamp(44px, 9vw, 74px);
    font-weight:800;
    letter-spacing:2px;
    color:#fff;
    text-shadow:0 4px 30px rgba(217,164,65,.35);
    line-height:1.05;
  }
  .hero h1 .dot{color:var(--gold)}
  .tagline{
    margin-top:10px;
    font-size:clamp(15px,3.4vw,19px);
    color:var(--cream-dim);
    font-weight:400;
  }
  .tagline b{color:var(--gold2);font-weight:700}

  /* ---------- Language toggle ---------- */
  .langbar{
    position:sticky;top:0;z-index:50;
    display:flex;justify-content:center;align-items:center;gap:14px;
    padding:10px 16px;
    background:rgba(23,17,10,.88);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .langbar .brand{font-weight:700;font-size:14px;color:var(--gold2);letter-spacing:1px}
  .langbar .spacer{flex:1;max-width:320px}
  .btn-lang{
    border:1px solid var(--line);background:rgba(217,164,65,.1);
    color:var(--cream);font-family:inherit;font-size:13px;font-weight:700;
    padding:6px 14px;border-radius:999px;cursor:pointer;
    transition:.2s;
  }
  .btn-lang:hover{background:var(--gold);color:#1a120b;border-color:var(--gold)}
  .btn-lang.active{background:var(--gold);color:#1a120b;border-color:var(--gold)}

  /* ---------- Categories ---------- */
  .cats{
    position:sticky;top:52px;z-index:40;
    display:flex;gap:8px;overflow-x:auto;
    padding:12px 16px;
    background:rgba(32,23,16,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    scrollbar-width:none;
  }
  .cats::-webkit-scrollbar{display:none}
  .cat-chip{
    flex:0 0 auto;
    display:flex;align-items:center;gap:6px;
    font-family:inherit;font-size:13.5px;font-weight:700;
    color:var(--cream-dim);
    background:var(--card);
    border:1px solid transparent;
    padding:8px 16px;border-radius:999px;cursor:pointer;
    transition:.18s;
  }
  .cat-chip:hover{color:var(--cream);border-color:var(--line)}
  .cat-chip.active{
    color:#1a120b;background:var(--gold);border-color:var(--gold);
    box-shadow:0 4px 16px rgba(217,164,65,.35);
  }

  /* ---------- Menu ---------- */
  main{max-width:760px;margin:0 auto;padding:26px 16px 90px}
  section.cat{margin-bottom:38px;scroll-margin-top:120px}
  .cat-head{
    display:flex;align-items:center;gap:12px;
    margin-bottom:16px;
  }
  .cat-head .ic{
    width:44px;height:44px;flex:0 0 44px;
    display:grid;place-items:center;
    font-size:22px;
    background:linear-gradient(145deg, var(--card2), var(--card));
    border:1px solid var(--line);
    border-radius:12px;
  }
  .cat-head h2{font-size:20px;font-weight:900;color:#fff}
  .cat-head .en-sub{font-size:12.5px;color:var(--cream-dim);font-weight:600;letter-spacing:.5px}
  .cat-head .rule{flex:1;height:1px;background:linear-gradient(90deg, var(--line), transparent)}

  .items{display:grid;gap:12px}
  .item{
    display:flex;align-items:center;gap:14px;
    background:linear-gradient(150deg, var(--card), var(--card2));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    box-shadow:var(--shadow);
    transition:.2s;
  }
  .item:hover{transform:translateY(-2px);border-color:rgba(217,164,65,.45)}
  .item .emoji{
    width:46px;height:46px;flex:0 0 46px;
    display:grid;place-items:center;
    font-size:23px;
    background:rgba(217,164,65,.1);
    border-radius:12px;
  }
  .item .info{flex:1;min-width:0}
  .item .name{font-weight:700;font-size:15.5px;color:#fff;line-height:1.4}
  .item .name .alt{font-weight:400;color:var(--cream-dim);font-size:13px;margin-inline-start:6px}
  .item .desc{font-size:12.5px;color:var(--cream-dim);margin-top:3px;line-height:1.55}
  .item .extra{font-size:12px;color:var(--gold2);margin-top:3px;line-height:1.5}
  .item .price{
    font-weight:900;font-size:15px;color:var(--gold2);
    background:rgba(217,164,65,.1);
    border:1px solid var(--line);
    padding:7px 12px;border-radius:999px;
    line-height:1.4;text-align:center;
    max-width:150px;flex:0 0 auto;
  }
  .cat-note{
    margin-top:12px;
    padding:10px 14px;
    background:rgba(217,164,65,.08);
    border:1px dashed var(--line);
    border-radius:12px;
    font-size:12.5px;color:var(--cream-dim);line-height:1.7;
  }
  .cat-note b{color:var(--gold2)}

  /* ---------- Info / footer ---------- */
  .info{
    margin-top:10px;
    display:grid;gap:10px;
    background:linear-gradient(150deg, var(--card), var(--card2));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    text-align:center;
  }
  .info h3{color:var(--gold2);font-size:17px;margin-bottom:4px}
  .info p{color:var(--cream-dim);font-size:14px}
  .info .row{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--cream)}
  .info .row span b{color:var(--gold2)}
  .cta{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    margin-top:6px;
    background:var(--gold);color:#1a120b;
    font-weight:900;font-size:15px;
    padding:12px 26px;border-radius:999px;text-decoration:none;
    box-shadow:0 6px 20px rgba(217,164,65,.35);
    transition:.2s;
  }
  .cta:hover{background:var(--gold2);transform:translateY(-1px)}

  footer{
    text-align:center;padding:22px 16px 30px;
    color:var(--cream-dim);font-size:12.5px;
    border-top:1px solid var(--line);
    letter-spacing:.4px;
  }
  footer b{color:var(--gold2)}

  @media (min-width:640px){
    .items{grid-template-columns:1fr 1fr}
    .info{text-align:start}
    .info .row{justify-content:flex-start}
  }
</style>
</head>

function cur(v){
  const c = lang === "ar" ? CAFE.currency : CAFE.currencyEn;
  if (typeof v === "number") return v + " " + c;
  return v + " " + c; /* نص جاهز زي "M: 25 | L: 45" */
}

function renderCats(){
  const wrap = document.getElementById("cats");
  wrap.innerHTML = "";
  MENU.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "cat-chip" + (i === 0 ? " active" : "");
    b.dataset.i = i;
    b.innerHTML = c.e + " " + c[lang];
    b.onclick = () => {
      document.querySelectorAll(".cat-chip").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      document.getElementById("cat-" + i).scrollIntoView({ behavior: "smooth" });
    };
    wrap.appendChild(b);
  });
}

        <div class="en-sub">${lang === "ar" ? c.en : c.ar}</div>
      </div>
      <div class="rule"></div>`;
    sec.appendChild(head);

    const items = document.createElement("div");
    items.className = "items";
    c.items.forEach(it => {
      const d = document.createElement("div");
      d.className = "item";
      const name = lang === "ar" ? it.ar : it.en;
      const alt  = lang === "ar" ? it.en : it.ar;
      let html = `
        <div class="info">
          <div class="name">${name}<span class="alt">${alt}</span></div>`;
      if (it.desc) html += `<div class="desc">${it.desc}</div>`;
      if (it.extra) it.extra.forEach(x => {
        html += `<div class="extra">${lang === "ar" ? x.ar : x.en}</div>`;
      });
      html += `
        </div>
        <div class="price">${cur(it.price)}</div>`;
      d.innerHTML = html;
      items.appendChild(d);
    });
    sec.appendChild(items);

    if (c.note){
      const note = document.createElement("div");
      note.className = "cat-note";
      const lines = c.note.map(n => lang === "ar" ? n.ar : n.en);
      note.innerHTML = "💡 " + lines.join(" &nbsp;•&nbsp; ");
      sec.appendChild(note);
    }

    main.appendChild(sec);
  });
}

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.getElementById("btnAr").classList.toggle("active", lang === "ar");
  document.getElementById("btnEn").classList.toggle("active", lang === "en");
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (T[lang][key] !== undefined) el.textContent = T[lang][key];
  });
  document.querySelector(".tagline").innerHTML = T[lang].tagline;
  renderCats();
  renderMenu();
}

document.getElementById("btnAr").onclick = () => { lang = "ar"; applyLang(); };
document.getElementById("btnEn").onclick = () => { lang = "en"; applyLang(); };

document.getElementById("waLink").href = "https://wa.me/" + CAFE.whatsapp + "?text=" + waMsg;
document.getElementById("yr").textContent = new Date().getFullYear();

applyLang();
</script>
