<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR المنيو — BAR CAFE</title>
<!-- ============================================================
     كارت QR جاهز للطباعة — BAR CAFE
     الكود بيوصّل الزبون مباشرة لصفحة المنيو.
     افتح الملف واطبعه (Ctrl+P) — أو اطبع من زر "طباعة الكارت".
     ============================================================ -->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#17110a;
    font-family:'Segoe UI',Tahoma,Arial,sans-serif;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:30px 16px;
  }
  .toolbar{margin-bottom:20px;display:flex;gap:10px}
  button{
    font-family:inherit;font-size:14px;font-weight:800;
    padding:11px 24px;border:none;border-radius:10px;cursor:pointer;transition:.2s;
  }
  .btn-print{background:#d9a441;color:#1a120b}
  .btn-print:hover{filter:brightness(1.1)}
  .btn-back{background:transparent;color:#f3e6d0;border:1px solid rgba(217,164,65,.3)}

  /* ---- الكارت ---- */
  .card{
    width:320px;max-width:92vw;
    background:
      radial-gradient(400px 200px at 50% 0%, rgba(217,164,65,.16), transparent 70%),
      linear-gradient(160deg,#2a1f14,#201710);
    border:1px solid rgba(217,164,65,.35);
    border-radius:22px;
    padding:26px 20px 22px;
    text-align:center;
    box-shadow:0 16px 44px rgba(0,0,0,.5);
    overflow:hidden;position:relative;
  }
  .card::after{
    content:"";position:absolute;inset:0;
    background-image:radial-gradient(rgba(240,197,105,.14) 1px, transparent 1px);
    background-size:22px 22px;opacity:.5;pointer-events:none;
  }
  .brand{
    font-size:26px;font-weight:900;color:#fff;letter-spacing:2px;
    position:relative;z-index:1;
  }
  .brand span{color:#d9a441}
  .sub{
    font-size:12px;color:#cbb79a;font-weight:700;letter-spacing:1.5px;
    margin:2px 0 14px;position:relative;z-index:1;
  }
  .qr-box{
    background:#fff;border-radius:16px;padding:14px;
    display:flex;justify-content:center;position:relative;z-index:1;
  }
  .qr-box svg{width:100%;max-width:210px;height:auto;display:block}
  .hint{
    margin-top:14px;font-size:14.5px;font-weight:800;color:#f0c569;
    position:relative;z-index:1;line-height:1.6;
  }
  .hint small{display:block;font-size:11px;font-weight:400;color:#cbb79a;margin-top:4px;direction:ltr}
  .foot{
    margin-top:10px;font-size:10.5px;color:#8a7a63;letter-spacing:.5px;
    position:relative;z-index:1;
  }
  /* ---- طباعة: الكارت بس ---- */
  @media print{
    body{background:#fff;padding:0}
    .toolbar{display:none}
    .card{
      box-shadow:none;border:1px solid #ddd;
      width:300px;position:absolute;inset:0;margin:auto;
    }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button class="btn-print" onclick="window.print()">🖨️ طباعة الكارت</button>
</div>

<div class="card">
  <div class="brand">BAR <span>•</span> CAFE</div>
  <div class="sub">MENU</div>
  <div class="qr-box" id="qrBox"></div>
  <div class="hint">
    📲 امسح الكود وشوف المنيو
    <small id="qrUrl"></small>
  </div>
  <div class="foot">BAR CAFE © <span id="yr"></span></div>
</div>

<script src="qrcode.min.js"></script>
<script>
  /* رابط صفحة المنيو (عدّله لو غيرت الرفع) */
  var MENU_URL = "https://basm32817-dotcom.github.io/barcafe-menu/";

  var qr = qrcode(0, "M");
  qr.addData(MENU_URL);
  qr.make();
  document.getElementById("qrBox").innerHTML = qr.createSvgTag(6, 0);
  document.getElementById("qrUrl").textContent = MENU_URL;
  document.getElementById("yr").textContent = new Date().getFullYear();
</script>
</body>
</html>
